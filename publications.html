<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>QDL Physics Institute | Publications</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta
    name="description"
    content="Publications and preprints from the QDL Physics Institute, including the current core QDL papers on integer-lattice structure, dimensional closure, SMEFT constraints, metrology, executed benchmark records, the QDL book, and domain applications."
  />
  <style>
    :root {
      --bg-page: #f3f4f6;
      --bg-card: #ffffff;
      --border-soft: #e5e7eb;
      --text-main: #0f172a;
      --text-soft: #6b7280;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --link: #0369a1;

      /* legend/badges */
      --badge-bg: #f8fafc;
      --badge-green: #16a34a;
      --badge-amber: #d97706;
      --badge-blue: #2563eb;
      --badge-purple: #7c3aed;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg-page);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }

    header {
      background: #0f172a;
      color: #e5e7eb;
      border-bottom: 1px solid #111827;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .nav {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0.75rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      min-width: 220px;
    }

    .logo-icon {
      width: 64px;
      height: 64px;
      border-radius: 8px;
      border: 1px solid #38bdf8;
      background: #020617;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex: 0 0 auto;
    }

    .logo-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .logo-text-main {
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-size: 0.8rem;
      line-height: 1.15;
    }

    .logo-text-sub {
      font-size: 0.7rem;
      color: #9ca3af;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      line-height: 1.15;
      margin-top: 0.12rem;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      font-size: 0.85rem;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .nav-links a {
      color: #e5e7eb;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      border: 1px solid transparent;
    }

    .nav-links a:hover {
      color: #f9fafb;
      border-color: rgba(148, 163, 184, 0.5);
      background: rgba(15, 23, 42, 0.9);
      text-decoration: none;
    }

    .nav-cta {
      border-radius: 999px;
      padding: 0.3rem 0.9rem;
      border: 1px solid #38bdf8;
      color: #e0f2fe;
      background: #0b1120;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.75rem 1.25rem 3rem;
    }

    /* HERO */
    .hero {
      margin-bottom: 1.6rem;
      background: var(--bg-card);
      border-radius: 18px;
      border: 1px solid var(--border-soft);
      box-shadow: 0 8px 24px rgba(15,23,42,0.06);
      padding: 1.6rem 1.5rem;
    }

    .hero-kicker {
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-size: 0.78rem;
      color: #6b7280;
      margin-bottom: 0.4rem;
    }

    .hero-title {
      font-size: clamp(1.9rem, 3vw, 2.3rem);
      margin-bottom: 0.55rem;
    }

    .hero-sub {
      font-size: 0.95rem;
      color: #4b5563;
      max-width: 54rem;
      margin-bottom: 0.9rem;
      line-height: 1.55;
    }

    .hero-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      font-size: 0.8rem;
      color: #6b7280;
    }

    .hero-chip {
      padding: 0.15rem 0.7rem;
      border-radius: 999px;
      border: 1px solid #e5e7eb;
      background: #f9fafb;
      white-space: nowrap;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: 0.95rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.55rem 1rem;
      border-radius: 999px;
      border: 1px solid transparent;
      font-size: 0.86rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
    }

    .btn-primary {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      box-shadow: 0 10px 24px rgba(37, 99, 235, 0.25);
    }

    .btn-primary:hover { filter: brightness(1.03); text-decoration: none; }

    .btn-secondary {
      background: #ffffff;
      color: #111827;
      border-color: #d1d5db;
    }

    .btn-secondary:hover { background: #f9fafb; text-decoration: none; }

    /* Legend + callouts */
    .callout {
      background: #ffffff;
      border-radius: 16px;
      border: 1px solid var(--border-soft);
      box-shadow: 0 8px 24px rgba(15,23,42,0.06);
      padding: 1rem 1.05rem;
      margin-top: 1rem;
      color: #374151;
      font-size: 0.9rem;
    }

    .callout-title {
      font-weight: 650;
      margin-bottom: 0.35rem;
      font-size: 0.98rem;
      color: #111827;
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin: 0.45rem 0 0.2rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.18rem 0.65rem;
      border-radius: 999px;
      border: 1px solid #e5e7eb;
      background: var(--badge-bg);
      font-size: 0.78rem;
      color: #334155;
      white-space: nowrap;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      display: inline-block;
    }

    .dot.green { background: var(--badge-green); }
    .dot.blue { background: var(--badge-blue); }
    .dot.amber { background: var(--badge-amber); }
    .dot.purple { background: var(--badge-purple); }

    .mini-grid {
      margin-top: 0.85rem;
      display: grid;
      grid-template-columns: minmax(0,1fr) minmax(0,1fr);
      gap: 0.8rem;
    }

    @media (max-width: 820px) {
      .mini-grid { grid-template-columns: 1fr; }
    }

    .mini-card {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 0.75rem 0.85rem;
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .mini-card strong { color: #111827; }

    /* Book callout (with cover) */
    .book-callout {
      margin-top: 1rem;
      padding: 1rem 1.05rem;
      border-radius: 16px;
      border: 1px solid rgba(124, 58, 237, 0.25);
      background: #fbfaff;
      box-shadow: 0 8px 24px rgba(15,23,42,0.06);
      color: #374151;
    }

    .book-wrap {
      display: grid;
      grid-template-columns: 140px minmax(0, 1fr);
      gap: 1rem;
      align-items: start;
      margin-top: 0.6rem;
    }

    @media (max-width: 640px) {
      .book-wrap { grid-template-columns: 1fr; }
    }

    .book-cover {
      width: 140px;
      border-radius: 10px;
      border: 1px solid rgba(15, 23, 42, 0.12);
      background: #ffffff;
      box-shadow: 0 10px 22px rgba(15,23,42,0.08);
      overflow: hidden;
    }

    .book-cover img {
      width: 100%;
      height: auto;
      display: block;
    }

    .book-title {
      font-weight: 700;
      font-size: 1.02rem;
      margin-bottom: 0.25rem;
      line-height: 1.3;
      color: #111827;
    }

    .book-meta {
      font-size: 0.84rem;
      color: #6b7280;
      margin-bottom: 0.55rem;
      line-height: 1.4;
    }

    .book-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      margin-top: 0.75rem;
    }

    .btn-book {
      background: linear-gradient(135deg, #7c3aed, #6d28d9);
      color: #ffffff;
      box-shadow: 0 10px 24px rgba(124, 58, 237, 0.22);
    }

    .btn-book:hover { filter: brightness(1.03); text-decoration: none; }

    .book-divider {
      height: 1px;
      background: rgba(15, 23, 42, 0.10);
      margin: 1rem 0;
    }

    .book-mini {
      display: grid;
      grid-template-columns: 140px minmax(0, 1fr);
      gap: 1rem;
      align-items: start;
      margin-top: 0.8rem;
    }

    @media (max-width: 640px) {
      .book-mini { grid-template-columns: 1fr; }
    }

    /* SECTIONS */
    section { margin-top: 1.9rem; }

    .section-header {
      display: flex;
      justify-content: space-between;
      gap: 1.5rem;
      align-items: baseline;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .section-title {
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: #111827;
    }

    .section-kicker {
      font-size: 0.82rem;
      color: var(--text-soft);
      max-width: 36rem;
      line-height: 1.5;
    }

    .card-column {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-width: 950px;
    }

    .card {
      background: var(--bg-card);
      border-radius: 16px;
      border: 1px solid var(--border-soft);
      padding: 0.95rem 1.05rem;
      box-shadow: 0 8px 24px rgba(15,23,42,0.06);
      font-size: 0.9rem;
      color: #374151;
    }

    .card .tagrow {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin: 0.15rem 0 0.55rem;
    }

    .tag {
      font-size: 0.74rem;
      padding: 0.16rem 0.55rem;
      border-radius: 999px;
      border: 1px solid #e5e7eb;
      background: #f9fafb;
      color: #4b5563;
      white-space: nowrap;
    }

    .tag-accent {
      border-color: rgba(37, 99, 235, 0.35);
      background: var(--accent-soft);
      color: #1d4ed8;
    }

    .tag-executed {
      border-color: rgba(22, 163, 74, 0.35
